[project]
name = "financial-agent"
version = "0.1.0"
description = "Modular multi-agent financial research and BUY/HOLD/SELL decision system"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
